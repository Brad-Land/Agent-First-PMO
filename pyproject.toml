[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpmo"
version = "0.1.0"
description = "Agent-first PMO: turns meeting transcripts into draft requirements and work items for human review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=7"]

[project.scripts]
pmo = "agentpmo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
